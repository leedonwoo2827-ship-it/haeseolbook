  26번: 이십육 번
  27번: 이십칠 번
  28번: 이십팔 번
  29번: 이십구 번
  30번: 삼십 번
  31번: 삼십일 번
  32번: 삼십이 번
  33번: 삼십삼 번
  34번: 삼십사 번
  35번: 삼십오 번
