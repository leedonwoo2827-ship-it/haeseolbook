  39번: 삼십구 번
  40번: 사십 번
  # 붙여 쓴 전산 합성어는 띄어서 읽게 (SuperTonic 이 긴 합성어를 흘려 읽는 일이 있다)
  주기억장치: 주 기억 장치
  보조기억장치: 보조 기억 장치
  기억장치: 기억 장치
  캐시기억장치: 캐시 기억 장치
  # 보기 기호 ㄱ·ㄴ·ㄷ·ㄹ … 는 자음 이름으로 (ㄱ은 → 기역은)
  ㄱ: 기역
  ㄴ: 니은
  ㄷ: 디귿
  ㄹ: 리을
  ㅁ: 미음
  ㅂ: 비읍
