# 해설북 프로젝트 발음 사전 — 기본 사전(studio/tts/pronunciation_map.yaml)에 더해지고 같은 키는 이 파일이 이긴다.
# 표기: 소리 (합성 직전에만 바뀌고 자막은 그대로)
rules:
  9급: 구급
  7급: 칠급
  5급: 오급
  8급: 팔급
  국가직 9급: 국가직 구급
  지방직 9급: 지방직 구급
  # 문항·보기 번호는 한자어로 (2번 보기 → 이 번 보기, 12번 → 십이 번)
  1번: 일 번
  2번: 이 번
  3번: 삼 번
  4번: 사 번
  5번: 오 번
  6번: 육 번
  7번: 칠 번
  8번: 팔 번
  9번: 구 번
  10번: 십 번
  11번: 십일 번
  12번: 십이 번
  13번: 십삼 번
  14번: 십사 번
  15번: 십오 번
  16번: 십육 번
  17번: 십칠 번
  18번: 십팔 번
  19번: 십구 번
